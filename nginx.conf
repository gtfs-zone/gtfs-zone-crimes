gzip on;
gzip_types text/html text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
# Serve the .gz files CI generates next to each asset.
gzip_static on;
gzip_vary on;

# Installed as an envsubst template (see web.Dockerfile): ${DATA_UPSTREAM},
# ${DATA_HOST} and ${NGINX_LOCAL_RESOLVERS} are filled in at container start.
# nginx's own variables are left alone because envsubst only replaces defined
# env vars.

# crimes.json from the bucket, cached so a Garage blip still serves the last copy.
proxy_cache_path /var/cache/nginx/data levels=1:2 keys_zone=data:1m max_size=64m inactive=7d use_temp_path=off;

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Resolved per request, so nginx starts even when the upstream does not
    # resolve yet.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    set $data_upstream "${DATA_UPSTREAM}";

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # crimes.json only: the bucket's state/ prefix is not the site's business.
    # Garage picks the bucket from the Host header.
    location = /data/crimes.json {
        rewrite ^ /crimes.json break;
        proxy_pass $data_upstream;
        proxy_set_header Host ${DATA_HOST};
        proxy_ssl_server_name on;
        proxy_ssl_name ${DATA_HOST};
        proxy_cache data;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=600";
        add_header X-Content-Type-Options "nosniff";
    }

    # Fingerprinted assets. add_header does not inherit into a location that
    # sets its own headers, so the security headers are repeated in each block.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # The pages are HTML that names the fingerprinted assets, so a stale copy
    # pins the browser to a previous deploy. Each page location below repeats
    # these headers.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Prerendered at build: a crime's page also serves its /all listing, and an
    # unknown crime is a real 404.
    location ~ "^/crime/(?<slug>[a-z0-9-]+)(/all)?/?$" {
        try_files /crime/$slug/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    location ~ "^/(?<section>most-wanted|pardoned)/?$" {
        try_files /$section/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Rap sheets are rendered by the app from crimes.json and kept out of the
    # index: the header says so before any script runs.
    location ~ "^/feed/[^/]+/?$" {
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex";
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Static files (logo, robots.txt, sitemap.xml); anything else is a 404.
    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
